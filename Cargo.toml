[package]
name = "orion-mcp"
version = "0.1.0"
description = "MCP server tools as Orion agent tools"
authors = ["Kumar Anirudha <orion@anirudha.dev>"]
license = "MIT"
edition = "2024"
rust-version = "1.95"
# Resolve dependencies to versions that still build on `rust-version`, so a
# dependency raising its own floor cannot silently raise ours.
resolver = "3"
repository = "https://github.com/anistark/orion-mcp"
homepage = "https://github.com/anistark/orion-mcp"
documentation = "https://docs.rs/orion-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "llm", "tools", "ai"]
categories = ["asynchronous", "network-programming"]

[dependencies]
orion-core = "0.9"
# The official MCP SDK: the client role over the Streamable HTTP transport,
# with reqwest and rustls underneath.
rmcp = { version = "3.8", default-features = false, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
async-trait = "0.1.92"
http = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# An in-process MCP server for the integration tests.
rmcp = { version = "3.8", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
